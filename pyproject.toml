[project]
name = "qmsd"
version = "0.1.0"
description = "Discovery of qudit triorthogonal codes for magic state distillation (after arXiv:2510.10852)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "galois>=0.3", "scipy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qmsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
